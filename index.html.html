`<h3>⚡ Сила в дії: коли з’являється робота?</h3><p>Робота виникає, коли <b>сила діє на тіло й тіло переміщується</b>. Вантаж, що нерухомо висить на пружині, роботи не виконує (l = 0).</p>

<div class="rule"><b>Правило 3.</b> Піднімаємо тіло рівномірно: F = mg, тому <b>A = mgh</b>.</div>

`<h3>🏁 Хто швидший? Потужність — швидкість роботи</h3><p>Однакову роботу можна виконати за різний час. Потужність показує, яку роботу виконано за одну секунду.</p>
<div class="rule"><b>Правило 1.</b> <b>N = A/t</b>. Одиниця — ват: 1 Вт = 1 Дж/с. 1 кВт = 1000 Вт, 1 МВт = 1 000 000 Вт.</div>
<div class="rule"><b>Правило 2.</b> За сталої швидкості: <b>N = F·v</b>, бо A = F·l, а l = v·t.</div>
<div class="rule"><b>Лайфхак.</b> Швидкість з км/год у м/с: поділи на 3,6 (72 км/год = 20 м/с). Час — тільки в секундах!</div>
<p><b>Алгоритм задачі:</b> знайди роботу (A = Fl або mgh), переведи час у секунди, поділи A на t. Якщо дано швидкість і силу — одразу N = Fv.</p>`,
`<h3>🎯 Дійшло не все: що таке ККД?</h3><p>Користуючись механізмом, ми завжди виконуємо більше роботи, ніж потрібно: частина йде на тертя й нагрівання.</p>
<div class="rule"><b>Золоте правило механіки.</b> Виграємо в силі — програємо у відстані; виграшу в роботі прості механізми не дають.</div>
<div class="rule"><b>Правило 1.</b> Корисна робота A<sub>к</sub> — те, заради чого працюємо (підняти вантаж: A<sub>к</sub> = mgh). Повна (затрачена) A<sub>п</sub> = F·l — те, що виконує прикладена сила.</div>
<div class="rule"><b>Правило 2.</b> <b>η = (A<sub>к</sub>/A<sub>п</sub>)·100 %</b>. Для реального механізму η &lt; 100 %.</div>
<p><b>Алгоритм задачі:</b> 1) A<sub>к</sub> = mgh; 2) A<sub>п</sub> = Fl (l — шлях, який проходить точка прикладання сили); 3) η = A<sub>к</sub>/A<sub>п</sub>·100 %.</p>`];
